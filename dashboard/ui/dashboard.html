const DOMAIN_COLOR = { Spectral:"var(--cyan)", Hybrid:"var(--purple)", Wavelet:"var(--teal)", Transformer:"var(--amber)", "Operator Learning":"var(--blue)", "Physics-Informed":"var(--green)", "State-Space":"var(--indigo)", Continuous:"var(--orange)", Uncertainty:"var(--pink)", "Mixture of Experts":"var(--red)" };

// ── Models Tab ────────────────────────────────────────────────────────────────
function ModelsTab({ registry, mlflowRuns, sota, archMap, experiments }) {
  // All unique model keys: from archMap (has image) + from experiments (has been trained)
  const allModels = useMemo(() => {
    const keys = new Set([
      ...Object.keys(archMap || {}),
      ...((experiments||[]).map(e => e.model).filter(Boolean)),
    ]);
    return [...keys].sort();
  }, [archMap, experiments]);

  const [selModel, setSelModel] = useState(null);
  const [subTab, setSubTab]   = useState("catalog"); // "catalog" | "mlflow"
  const [search, setSearch]   = useState("");

  // Best result per model across all benchmarks
  const bestPerModel = useMemo(() => {
    const m = {};
    for (const e of (experiments||[])) {
      if (!e.model || e.val_l2_rel == null) continue;
      if (!m[e.model] || e.val_l2_rel < m[e.model].val_l2_rel) m[e.model] = e;
    }
    return m;
  }, [experiments]);

  // Benchmarks each model has been run on
  const benchmarksPerModel = useMemo(() => {
    const m = {};
    for (const e of (experiments||[])) {
      if (!e.model || !e.benchmark) continue;
      if (!m[e.model]) m[e.model] = new Set();
      m[e.model].add(e.benchmark);
    }
    return m;
  }, [experiments]);

  const filteredModels = useMemo(() => {
    if (!search) return allModels;
    const q = search.toLowerCase();
    return allModels.filter(k => {
      const info = MODEL_INFO[k] || {};
      return k.toLowerCase().includes(q) ||
        (info.family||"").toLowerCase().includes(q) ||
        (info.domain||"").toLowerCase().includes(q) ||
        (info.desc||"").toLowerCase().includes(q);
    });
  }, [allModels, search]);

  return (
    <div style={{display:"flex",flex:1,overflow:"hidden",flexDirection:"column"}}>
      {/* Sub-tab bar */}
      <div style={{display:"flex",borderBottom:"1px solid var(--border)",background:"var(--bg1)",
                   padding:"0 14px",gap:4,flexShrink:0,alignItems:"center"}}>
        {[["catalog","Model Catalog"],["mlflow","MLflow Runs"]].map(([k,label]) => (
          <div key={k}
            style={{padding:"8px 12px",cursor:"pointer",fontSize:12,fontWeight:500,
                    color: subTab===k ? "var(--amber)" : "var(--txt2)",
                    borderBottom: subTab===k ? "2px solid var(--amber)" : "2px solid transparent",
                    marginBottom:-1}}
            onClick={() => setSubTab(k)}>
            {label}
            {k==="catalog" && ` (${allModels.length})`}
            {k==="mlflow" && ` (${(mlflowRuns||[]).length})`}
          </div>
        ))}
        {subTab==="catalog" && (
          <input type="text" placeholder="Search models…" value={search}
            onChange={e=>setSearch(e.target.value)}
            style={{marginLeft:"auto",width:200,padding:"3px 8px",fontSize:11,
                    background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:4,
                    color:"var(--txt1)",fontFamily:"var(--mono)"}}/>
        )}
      </div>

      {subTab === "catalog" && (
        <div style={{display:"flex",flex:1,overflow:"hidden"}}>
          {/* Card grid */}
          <div style={{flex:1,overflow:"auto",padding:14,display:"grid",
                       gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",
                       gap:12,alignContent:"start"}}>
            {filteredModels.map(key => {
              const info   = MODEL_INFO[key] || {};
              const imgUrl = archMap?.[key];
              const best   = bestPerModel[key];
              const bms    = benchmarksPerModel[key];
              const isSel  = selModel === key;
              return (
                <div key={key}
                  onClick={() => setSelModel(isSel ? null : key)}
                  style={{background: isSel ? "rgba(251,191,36,.06)" : "var(--bg1)",
                          border:`1px solid ${isSel ? "var(--amber)" : "var(--border)"}`,
                          borderRadius:7,cursor:"pointer",overflow:"hidden",
                          transition:"border-color .15s",display:"flex",flexDirection:"column"}}>
                  {/* Arch image */}
                  {imgUrl ? (
                    <img src={`${API}${imgUrl}`} alt={key}
                      style={{width:"100%",height:110,objectFit:"cover",display:"block",
                              borderBottom:"1px solid var(--border)"}}/>
                  ) : (
                    <div style={{width:"100%",height:110,background:"var(--bg2)",
                                 borderBottom:"1px solid var(--border)",display:"flex",
                                 alignItems:"center",justifyContent:"center",
                                 fontSize:11,color:"var(--txt3)",fontFamily:"var(--mono)"}}>
                      no image
                    </div>
                  )}
                  {/* Card body */}
                  <div style={{padding:"8px 10px",flex:1,display:"flex",flexDirection:"column",gap:4}}>
                    <div style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:700,
                                 color:"var(--txt1)",lineHeight:1.3}}>{key}</div>
                    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                      {info.family && (
                        <span style={{fontSize:9,padding:"1px 5px",borderRadius:3,
                                      background:"var(--bg2)",border:"1px solid var(--border)",
                                      color:DOMAIN_COLOR[info.domain]||"var(--txt2)",
                                      fontFamily:"var(--mono)"}}>{info.family}</span>
                      )}
                    </div>
                    {info.desc && (
                      <div style={{fontSize:10,color:"var(--txt2)",lineHeight:1.4,
                                   display:"-webkit-box",WebkitLineClamp:2,
                                   WebkitBoxOrient:"vertical",overflow:"hidden"}}>
                        {info.desc}
                      </div>
                    )}
                    <div style={{marginTop:"auto",display:"flex",alignItems:"center",
                                 justifyContent:"space-between",paddingTop:4}}>
                      {best ? (
                        <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--green)",fontWeight:700}}>
                          {fmt(best.val_l2_rel,4)}
                        </span>
                      ) : (
                        <span style={{fontSize:10,color:"var(--txt3)"}}>not trained</span>
                      )}
                      {bms && (
                        <span style={{fontSize:9,color:"var(--txt3)"}}>
                          {bms.size} bm{bms.size!==1?"s":""}
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
            {filteredModels.length === 0 && (
              <div style={{gridColumn:"1/-1",textAlign:"center",padding:40,
                           color:"var(--txt3)",fontSize:12}}>No models match "{search}"</div>
            )}
          </div>

          {/* Detail panel */}
          {selModel && (() => {
            const info   = MODEL_INFO[selModel] || {};
            const imgUrl = archMap?.[selModel];
            const bms    = benchmarksPerModel[selModel] ? [...benchmarksPerModel[selModel]].sort() : [];
            // Best result per benchmark for this model
            const scoresByBm = {};
            for (const e of (experiments||[])) {
              if (e.model !== selModel || e.val_l2_rel == null) continue;
              if (!scoresByBm[e.benchmark] || e.val_l2_rel < scoresByBm[e.benchmark]) {
                scoresByBm[e.benchmark] = e.val_l2_rel;
              }
            }
            return (
              <div style={{width:340,background:"var(--bg1)",borderLeft:"1px solid var(--border)",
                           overflow:"auto",flexShrink:0,display:"flex",flexDirection:"column"}}>
                {/* Header */}
                <div style={{padding:"12px 14px",borderBottom:"1px solid var(--border)",
                             display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                  <span style={{fontFamily:"var(--mono)",fontSize:13,fontWeight:700,
                                color:"var(--amber)",flex:1}}>{selModel}</span>
                  <button className="btn" style={{padding:"2px 8px",fontSize:10}}
                    onClick={()=>setSelModel(null)}>✕</button>
                </div>

                {/* Full arch image */}
                {imgUrl && (
                  <div style={{padding:"10px 14px",borderBottom:"1px solid var(--border)",flexShrink:0}}>
                    <div className="sec-label" style={{marginBottom:6}}>Architecture</div>
                    <img src={`${API}${imgUrl}`} alt={selModel}
                      style={{width:"100%",borderRadius:5,border:"1px solid var(--border)",display:"block"}}/>
                  </div>
                )}

                <div style={{padding:"12px 14px",overflow:"auto",flex:1}}>
                  {/* Family / domain */}
                  <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                    {info.family && (
                      <span style={{fontSize:10,padding:"2px 7px",borderRadius:4,
                                    background:"var(--bg2)",border:"1px solid var(--border)",
                                    color:DOMAIN_COLOR[info.domain]||"var(--txt2)",
                                    fontFamily:"var(--mono)"}}>{info.family}</span>
                    )}
                    {info.domain && (
                      <span style={{fontSize:10,padding:"2px 7px",borderRadius:4,
                                    background:"var(--bg2)",border:"1px solid var(--border)",
                                    color:"var(--txt2)",fontFamily:"var(--mono)"}}>{info.domain}</span>
                    )}
                  </div>

                  {/* Description */}
                  {info.desc && (
                    <>
                      <div className="sec-label">Description</div>
                      <div style={{fontSize:11,color:"var(--txt2)",lineHeight:1.6,marginBottom:10}}>
                        {info.desc}
                      </div>
                    </>
                  )}

                  {/* Key features */}
                  {info.features && (
                    <>
                      <div className="sec-label">Key Features</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
                        {info.features.map(f => (
                          <span key={f} style={{fontSize:10,padding:"2px 7px",borderRadius:4,
                                                background:"rgba(56,189,248,.08)",
                                                border:"1px solid rgba(56,189,248,.2)",
                                                color:"var(--cyan)",fontFamily:"var(--mono)"}}>
                            {f}
                          </span>
                        ))}
                      </div>
                    </>
                  )}

                  {/* Benchmark scores */}
                  {bms.length > 0 && (
                    <>
                      <div className="sec-label">Results by Benchmark</div>
                      <table style={{width:"100%",borderCollapse:"collapse",
                                     fontFamily:"var(--mono)",fontSize:11,marginBottom:8}}>
                        <thead>
                          <tr>
                            {["Benchmark","Best val_l2_rel","vs SOTA"].map(h => (
                              <th key={h} style={{padding:"4px 6px",textAlign:"left",
                                                  color:"var(--txt2)",fontWeight:600,fontSize:10,
                                                  borderBottom:"1px solid var(--border)"}}>{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {bms.map(bm => {
                            const score = scoresByBm[bm];
                            const sotaTarget = sota?.[bm]?.sota;
                            const ratio = score && sotaTarget ? score / sotaTarget : null;
                            return (
                              <tr key={bm} style={{borderBottom:"1px solid var(--border)"}}>
                                <td style={{padding:"4px 6px",color:"var(--cyan)"}}>{bm}</td>
                                <td style={{padding:"4px 6px",fontWeight:700,
                                            color: ratio && ratio<1.2 ? "var(--green)" : ratio && ratio<3 ? "var(--amber)" : "var(--red)"}}>
                                  {score != null ? fmt(score,4) : "—"}
                                </td>
                                <td style={{padding:"4px 6px",color:"var(--txt2)"}}>
                                  {ratio ? `${ratio.toFixed(2)}×` : "—"}
                                  {ratio && ratio < 1 && <span style={{color:"var(--green)"}}> ✓</span>}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </>
                  )}

                  {bms.length === 0 && (
                    <div style={{fontSize:11,color:"var(--txt3)",marginBottom:8}}>
                      No training runs recorded yet.
                    </div>
                  )}
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {subTab === "mlflow" && (
        <MLflowRunsTable runs={mlflowRuns || []} sota={sota} bmFilter="all"/>
      )}
    </div>
  );
}

// ── Benchmarks Tab ────────────────────────────────────────────────────────────
function BenchmarksTab({ sota, registry, experiments, archMap }) {
  const [selBm, setSelBm] = useState(null);

  // All benchmark keys — BENCHMARK_INFO is authoritative; supplement with live data
  const allBms = useMemo(() => {
    const keys = new Set([
      ...Object.keys(BENCHMARK_INFO),          // always show all defined benchmarks
      ...Object.keys(sota || {}),
      ...Object.keys(registry || {}),
      ...(experiments||[]).map(e => e.benchmark).filter(Boolean),
    ]);
    return [...keys].sort();
  }, [sota, registry, experiments]);

  // Best result per (benchmark, model) combo
  const scoresByBm = useMemo(() => {
    const m = {};
    for (const e of (experiments||[])) {
      if (!e.model || !e.benchmark || e.val_l2_rel == null) continue;
      if (!m[e.benchmark]) m[e.benchmark] = {};
      if (!m[e.benchmark][e.model] || e.val_l2_rel < m[e.benchmark][e.model]) {
        m[e.benchmark][e.model] = e.val_l2_rel;
      }
    }
    return m;
  }, [experiments]);

  const selectedBmScores = selBm ? (scoresByBm[selBm] || {}) : {};
  const sortedModels = Object.entries(selectedBmScores)
    .sort(([,a],[,b]) => a - b);
  const info = selBm ? (BENCHMARK_INFO[selBm] || {}) : {};
  const sotaData = selBm ? (sota?.[selBm] || {}) : {};

  return (
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      {/* Left: benchmark cards */}
      <div style={{flex:1,overflow:"auto",padding:16,
                   display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",
                   gap:14,alignContent:"start"}}>
        {allBms.map(bm => {
          const info     = BENCHMARK_INFO[bm] || {};
          const sd       = sota?.[bm] || {};
          const scores   = scoresByBm[bm] || {};
          const bestScore= Object.values(scores).length ? Math.min(...Object.values(scores)) : null;
          const sotaT    = sd.sota;
          const ratio    = bestScore && sotaT ? bestScore / sotaT : null;
          const modelCount = Object.keys(scores).length;
          const isSel    = selBm === bm;
          return (
            <div key={bm}
              onClick={() => setSelBm(isSel ? null : bm)}
              style={{background: isSel ? "rgba(251,191,36,.06)" : "var(--bg1)",
                      border:`1px solid ${isSel ? "var(--amber)" : "var(--border)"}`,
                      borderRadius:8,cursor:"pointer",padding:"14px 16px",
                      display:"flex",flexDirection:"column",gap:8,
                      transition:"border-color .15s"}}>
              {/* Header */}
              <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"var(--mono)",fontSize:13,fontWeight:700,
                               color: info.color || "var(--cyan)",marginBottom:3}}>
                    {info.name || bm}
                  </div>
                  <div style={{fontSize:10,fontFamily:"var(--mono)",
                               color:"var(--txt2)",marginBottom:2}}>{bm}</div>
                </div>
                {info.difficulty && (
                  <span style={{fontSize:9,padding:"2px 6px",borderRadius:4,flexShrink:0,
                                background:"var(--bg2)",border:"1px solid var(--border)",
                                color:DIFFICULTY_COLOR[info.difficulty]||"var(--txt2)",
                                fontFamily:"var(--mono)"}}>
                    {info.difficulty}
                  </span>
                )}
              </div>

              {/* Domain + resolution */}
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {info.domain && (
                  <span style={{fontSize:9,padding:"1px 5px",borderRadius:3,
                                background:"var(--bg2)",border:"1px solid var(--border)",
                                color:"var(--purple)",fontFamily:"var(--mono)"}}>{info.domain}</span>
                )}
                {info.resolution && (
                  <span style={{fontSize:9,padding:"1px 5px",borderRadius:3,
                                background:"var(--bg2)",border:"1px solid var(--border)",
                                color:"var(--txt3)",fontFamily:"var(--mono)"}}>{info.resolution}</span>
                )}
              </div>

              {/* Equation */}
              {info.equation && (
                <div style={{fontFamily:"var(--mono)",fontSize:10,
                             color:"var(--txt2)",background:"var(--bg2)",
                             borderRadius:4,padding:"4px 8px",
                             border:"1px solid var(--border)"}}>
                  {info.equation}
                </div>
              )}

              {/* Description (truncated) */}
              {info.desc && (
                <div style={{fontSize:10,color:"var(--txt2)",lineHeight:1.5,
                             display:"-webkit-box",WebkitLineClamp:2,
                             WebkitBoxOrient:"vertical",overflow:"hidden"}}>
                  {info.desc}
                </div>
              )}

              {/* Stats row */}
              <div style={{display:"flex",gap:12,marginTop:"auto",
                           paddingTop:6,borderTop:"1px solid var(--border)"}}>
                <div>
                  <div style={{fontSize:9,color:"var(--txt3)"}}>SOTA</div>
                  <div style={{fontSize:11,color:"var(--txt2)",fontFamily:"var(--mono)",fontWeight:600}}>
                    {sotaT ? fmt(sotaT,4) : "—"}
                  </div>
                </div>
                <div>
                  <div style={{fontSize:9,color:"var(--txt3)"}}>Our Best</div>
                  <div style={{fontSize:11,fontFamily:"var(--mono)",fontWeight:700,
                               color: ratio && ratio<1.2 ? "var(--green)" : ratio && ratio<3 ? "var(--amber)" : bestScore ? "var(--red)" : "var(--txt3)"}}>
                    {bestScore != null ? fmt(bestScore,4) : "—"}
                  </div>
                </div>
                {ratio && (
                  <div>
                    <div style={{fontSize:9,color:"var(--txt3)"}}>Gap</div>
                    <div style={{fontSize:11,fontFamily:"var(--mono)",fontWeight:600,
                                 color: ratio<1 ? "var(--green)" : ratio<2 ? "var(--amber)" : "var(--red)"}}>
                      {ratio.toFixed(2)}×{ratio < 1 && " ✓"}
                    </div>
                  </div>
                )}
                <div style={{marginLeft:"auto"}}>
                  <div style={{fontSize:9,color:"var(--txt3)"}}>Models</div>
                  <div style={{fontSize:11,color:"var(--txt2)",fontFamily:"var(--mono)"}}>{modelCount}</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Right: benchmark detail */}
      {selBm && (
        <div style={{width:360,background:"var(--bg1)",borderLeft:"1px solid var(--border)",
                     overflow:"auto",flexShrink:0,display:"flex",flexDirection:"column"}}>
          {/* Header */}
          <div style={{padding:"12px 16px",borderBottom:"1px solid var(--border)",
                       display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <div style={{flex:1}}>
              <div style={{fontFamily:"var(--mono)",fontSize:14,fontWeight:700,
                           color:info.color||"var(--cyan)",lineHeight:1.3}}>
                {info.name || selBm}
              </div>
              <div style={{fontSize:10,color:"var(--txt2)",fontFamily:"var(--mono)"}}>{selBm}</div>
            </div>
            <button className="btn" style={{padding:"2px 8px",fontSize:10}}
              onClick={()=>setSelBm(null)}>✕</button>
          </div>

          <div style={{padding:"14px 16px",overflow:"auto",flex:1}}>
            {/* Equation */}
            {info.equation && (
              <>
                <div className="sec-label">PDE / Equation</div>
                <div style={{fontFamily:"var(--mono)",fontSize:12,color:"var(--amber)",
                             background:"var(--bg2)",borderRadius:5,padding:"8px 12px",
                             border:"1px solid var(--border)",marginBottom:12}}>
                  {info.equation}
                </div>
              </>
            )}

            {/* Tags row */}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
              {info.domain && (
                <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,
                              background:"var(--bg2)",border:"1px solid var(--border)",
                              color:"var(--purple)",fontFamily:"var(--mono)"}}>{info.domain}</span>
              )}
              {info.resolution && (
                <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,
                              background:"var(--bg2)",border:"1px solid var(--border)",
                              color:"var(--txt2)",fontFamily:"var(--mono)"}}>{info.resolution}</span>
              )}
              {info.difficulty && (
                <span style={{fontSize:10,padding:"2px 8px",borderRadius:4,
                              background:"var(--bg2)",border:"1px solid var(--border)",
                              color:DIFFICULTY_COLOR[info.difficulty]||"var(--txt2)",
                              fontFamily:"var(--mono)"}}>{info.difficulty}</span>
              )}
            </div>

            {/* Description */}
            {info.desc && (
              <>
                <div className="sec-label">Overview</div>
                <div style={{fontSize:11,color:"var(--txt2)",lineHeight:1.7,marginBottom:12}}>
                  {info.desc}
                </div>
              </>
            )}

            {info.formulation && (
              <>
                <div className="sec-label">Problem Formulation</div>
                <div style={{fontSize:11,color:"var(--txt2)",lineHeight:1.7,marginBottom:12}}>
                  {info.formulation}
                </div>
              </>
            )}

            {(info.ic || info.bc) && (
              <>
                <div className="sec-label">Conditions</div>
                <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
                  {info.ic && (
                    <div style={{background:"var(--bg2)",borderRadius:4,padding:"7px 10px",
                                 border:"1px solid var(--border)"}}>
                      <span style={{fontSize:9,fontWeight:700,color:"var(--cyan)",
                                    fontFamily:"var(--mono)",marginRight:6}}>IC</span>
                      <span style={{fontSize:10,color:"var(--txt2)",lineHeight:1.6}}>{info.ic}</span>
                    </div>
                  )}
                  {info.bc && (
                    <div style={{background:"var(--bg2)",borderRadius:4,padding:"7px 10px",
                                 border:"1px solid var(--border)"}}>
                      <span style={{fontSize:9,fontWeight:700,color:"var(--purple)",
                                    fontFamily:"var(--mono)",marginRight:6}}>BC</span>
                      <span style={{fontSize:10,color:"var(--txt2)",lineHeight:1.6}}>{info.bc}</span>
                    </div>
                  )}
                </div>
              </>
            )}

            {/* Notes */}
            {info.note && (
              <div style={{background:"rgba(251,191,36,.06)",borderRadius:5,
                           border:"1px solid rgba(251,191,36,.2)",padding:"8px 12px",marginBottom:14}}>
                <span style={{fontSize:9,color:"var(--amber)",fontWeight:700,
                              fontFamily:"var(--mono)"}}>NOTE  </span>
                <span style={{fontSize:11,color:"var(--txt2)",lineHeight:1.5}}>{info.note}</span>
              </div>
            )}

            {info.numerical && (
              <>
                <div className="sec-label">Classical Numerical Methods</div>
                <div style={{fontSize:11,color:"var(--txt2)",lineHeight:1.7,marginBottom:12,
                             background:"rgba(56,189,248,.04)",borderRadius:5,
                             border:"1px solid rgba(56,189,248,.12)",padding:"10px 12px"}}>
                  {info.numerical}
                </div>
              </>
            )}

            {/* SOTA target */}
            {sotaData.sota && (
              <>
                <div className="sec-label">SOTA Target</div>
                <div className="metric-row" style={{marginBottom:4}}>
                  <span className="metric-key">val_l2_rel (SOTA)</span>
                  <span className="metric-val" style={{color:"var(--green)",fontFamily:"var(--mono)"}}>
                    {fmt(sotaData.sota,6)}
                  </span>
                </div>
                {sotaData.source && (
                  <div style={{fontSize:10,color:"var(--txt3)",marginBottom:12,fontFamily:"var(--mono)"}}>
                    {sotaData.source}
                  </div>
                )}
              </>
            )}

            {/* Placeholder for benchmark visualization */}
            <div style={{background:"var(--bg2)",borderRadius:6,border:"1px dashed var(--border)",
                         padding:"24px 16px",textAlign:"center",marginBottom:14}}>
              <div style={{fontSize:11,color:"var(--txt3)",marginBottom:4}}>Benchmark Visualization</div>
              <div style={{fontSize:10,color:"var(--txt3)"}}>Coming soon — add to figs/benchmarks/</div>
            </div>

            {/* Model leaderboard for this benchmark */}
            {sortedModels.length > 0 && (
              <>
                <div className="sec-label">Model Leaderboard</div>
                <table style={{width:"100%",borderCollapse:"collapse",
                               fontFamily:"var(--mono)",fontSize:11}}>
                  <thead>
                    <tr>
                      {["#","Model","Best val_l2_rel","vs SOTA"].map(h => (
                        <th key={h} style={{padding:"4px 6px",textAlign:"left",
                                            color:"var(--txt2)",fontWeight:600,fontSize:10,
                                            borderBottom:"1px solid var(--border)"}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {sortedModels.map(([model, score], i) => {
                      const ratio = sotaData.sota && score ? score / sotaData.sota : null;
                      const isChamp = i === 0;
                      return (
                        <tr key={model}
                          style={{borderBottom:"1px solid var(--border)",
                                  background: isChamp ? "rgba(251,191,36,.04)" : "transparent"}}>
                          <td style={{padding:"4px 6px",color:"var(--txt3)"}}>{i+1}</td>
                          <td style={{padding:"4px 6px",color:"var(--purple)"}}>
                            {model}
                            {isChamp && <span style={{marginLeft:5,color:"var(--amber)"}}>★</span>}
                          </td>
                          <td style={{padding:"4px 6px",fontWeight:700,
                                      color: ratio && ratio<1.2 ? "var(--green)" : ratio && ratio<3 ? "var(--amber)" : "var(--red)"}}>
                            {fmt(score,4)}
                          </td>
                          <td style={{padding:"4px 6px",color:"var(--txt2)"}}>
                            {ratio ? `${ratio.toFixed(2)}×` : "—"}
                            {ratio && ratio < 1 && <span style={{color:"var(--green)"}}> ✓</span>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── MLflow Runs Table ─────────────────────────────────────────────────────────
function MLflowRunsTable({ runs, sota, bmFilter }) {
  const [search, setSearch] = useState("");
  const [sortKey, setSortKey] = useState("val_l2_rel");
  const [sortDir, setSortDir] = useState(1);
  const [selRun, setSelRun] = useState(null);

  const toggleSort = k => {
    if (sortKey === k) setSortDir(d => -d);
    else { setSortKey(k); setSortDir(1); }
  };

  const filtered = useMemo(() => {
    let rows = runs;
    if (bmFilter && bmFilter !== "all") rows = rows.filter(r => r.benchmark === bmFilter);
    if (search) {
      const q = search.toLowerCase();
      rows = rows.filter(r => r.exp_name?.toLowerCase().includes(q) ||
        r.benchmark?.toLowerCase().includes(q) || r.model?.toLowerCase().includes(q));
    }
    return [...rows].sort((a,b) => {
      const av = a[sortKey] ?? 999, bv = b[sortKey] ?? 999;
      return sortDir * (av < bv ? -1 : av > bv ? 1 : 0);
    });
  }, [runs, bmFilter, search, sortKey, sortDir]);

  const Th = ({k,label}) => (
    <th onClick={() => toggleSort(k)}
      style={{position:"sticky",top:0,background:"var(--bg1)",padding:"8px 10px",
              textAlign:"left",color:"var(--txt2)",fontWeight:600,fontSize:11,
              borderBottom:"1px solid var(--border)",cursor:"pointer",whiteSpace:"nowrap"}}>
      {label} {sortKey===k ? (sortDir>0?"↑":"↓") : ""}
    </th>
  );

  return (
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
        <div className="filter-bar">
          <input type="text" placeholder="Search runs…" value={search}
            onChange={e=>setSearch(e.target.value)} style={{width:220}}/>
          <span style={{marginLeft:"auto",color:"var(--txt2)",fontSize:11}}>{filtered.length} / {runs.length} runs</span>
        </div>
        <div style={{flex:1,overflow:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontFamily:"var(--mono)",fontSize:11}}>
            <thead>
              <tr>
                <Th k="benchmark" label="Benchmark"/>
                <Th k="model" label="Model"/>
                <Th k="val_l2_rel" label="val_l2_rel"/>
                <Th k="training_seconds" label="Train(s)"/>
                <Th k="peak_vram_mb" label="VRAM MB"/>
                <Th k="num_steps" label="Steps"/>
                <th style={{position:"sticky",top:0,background:"var(--bg1)",padding:"8px 10px",
                            color:"var(--txt2)",fontWeight:600,fontSize:11,
                            borderBottom:"1px solid var(--border)"}}>Exp Name</th>
                <Th k="diag_high_freq" label="hi-freq"/>
              </tr>
            </thead>
            <tbody>
              {filtered.map(r => {
                const sotaTarget = sota?.[r.benchmark]?.sota;
                const ratio = sotaTarget && r.val_l2_rel ? r.val_l2_rel / sotaTarget : null;
                const isSelected = selRun?.run_id === r.run_id;
                return (
                  <tr key={r.run_id}
                    style={{borderBottom:"1px solid var(--border)",cursor:"pointer",
                            background: isSelected ? "var(--indigo-dim)" : "transparent"}}
                    onClick={() => setSelRun(isSelected ? null : r)}>
                    <td style={{padding:"6px 10px",color:"var(--cyan)"}}>{r.benchmark}</td>
                    <td style={{padding:"6px 10px",color:"var(--purple)"}}>{r.model}</td>
                    <td style={{padding:"6px 10px",fontWeight:700,
                                color: ratio && ratio<1.2 ? "var(--green)" : ratio && ratio<3 ? "var(--amber)" : "var(--red)"}}>
                      {fmt(r.val_l2_rel,6)}
                    </td>
                    <td style={{padding:"6px 10px",color:"var(--txt2)"}}>{r.training_seconds ? Math.round(r.training_seconds)+"s" : "—"}</td>
                    <td style={{padding:"6px 10px",color:"var(--txt2)"}}>{r.peak_vram_mb ? Math.round(r.peak_vram_mb) : "—"}</td>
                    <td style={{padding:"6px 10px",color:"var(--txt2)"}}>{r.num_steps ? Math.round(r.num_steps) : "—"}</td>
                    <td style={{padding:"6px 10px",color:"var(--txt2)",maxWidth:220,overflow:"hidden",
                                textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.exp_name}</td>
                    <td style={{padding:"6px 10px",
                                color: r.diag_high_freq > 0.2 ? "var(--red)" : r.diag_high_freq > 0.05 ? "var(--amber)" : "var(--green)"}}>
                      {r.diag_high_freq ? fmt(r.diag_high_freq,3) : "—"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {filtered.length === 0 && <div className="empty">No MLflow runs yet — run an experiment to populate.</div>}
        </div>
      </div>
      {/* Run detail panel */}
      {selRun && (
        <div style={{width:320,background:"var(--bg1)",borderLeft:"1px solid var(--border)",
                     overflow:"auto",padding:"14px 16px",flexShrink:0}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
            <span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--cyan)"}}>Run detail</span>
            <button className="btn" style={{padding:"2px 8px",fontSize:10}} onClick={()=>setSelRun(null)}>✕</button>
          </div>
          <div style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--txt2)",marginBottom:10,wordBreak:"break-all"}}>
            {selRun.run_id}
          </div>
          <div className="sec-label">Metrics</div>
          {[["val_l2_rel",selRun.val_l2_rel,6],["training_s",selRun.training_seconds,0],
            ["vram_mb",selRun.peak_vram_mb,0],["steps",selRun.num_steps,0],
            ["hi-freq",selRun.diag_high_freq,4],["lo-freq",selRun.diag_low_freq,4]].map(([k,v,d]) =>
            v != null ? (
              <div key={k} className="metric-row">
                <span className="metric-key">{k}</span>
                <span className="metric-val" style={{fontFamily:"var(--mono)",fontSize:12}}>{typeof v==="number"?v.toFixed(d):v}</span>
              </div>
            ) : null
          )}
          {selRun.params && Object.keys(selRun.params).length > 0 && <>
            <div className="sec-label" style={{marginTop:12}}>Params</div>
            <div className="kv-grid">
              {Object.entries(selRun.params).map(([k,v]) => (
                <div key={k} className="kv-item">
                  <div className="kv-k">{k}</div>
                  <div className="kv-v" style={{fontSize:11}}>{v}</div>
                </div>
              ))}
            </div>
          </>}
        </div>
      )}
    </div>
  );
}


// ── Reflection Panel ──────────────────────────────────────────────────────────
function ReflectionPanel({ reflections, sota, bmFilter }) {
  const [sel, setSel] = useState(null);
  const [refreshing, setRefreshing] = useState(false);

  const bms = Object.keys(reflections).filter(b => bmFilter === "all" || b === bmFilter);

  async function doRefresh(bm) {
    setRefreshing(true);
    try {
      const r = await fetch(`${API}/api/reflection/${bm}/refresh`, {method:"POST"});
      if (r.ok) { const d = await r.json(); reflections[bm] = d; setSel(d); }
    } finally { setRefreshing(false); }
  }

  const r = sel || (bms.length === 1 ? reflections[bms[0]] : null);

  return (
    <div style={{display:"flex",height:"100%",overflow:"hidden"}}>
      {/* Sidebar */}
      <div style={{width:200,borderRight:"1px solid var(--border)",overflowY:"auto",padding:"10px 0",flexShrink:0}}>
        <div style={{padding:"0 12px 8px",fontSize:10,color:"var(--txt2)",textTransform:"uppercase",letterSpacing:1}}>Benchmarks</div>
        {bms.length === 0 && <div style={{padding:"8px 14px",fontSize:11,color:"var(--txt2)"}}>No reflections yet</div>}
        {bms.map(bm => {
          const d = reflections[bm];
          const beats = sota[bm] && d.best_val && d.best_val < sota[bm].sota;
          return (
            <div key={bm} onClick={()=>setSel(d)}
              style={{padding:"7px 14px",cursor:"pointer",fontSize:11,fontFamily:"var(--mono)",
                      background: sel?.benchmark===bm ? "var(--bg2)" : "transparent",
                      borderLeft: sel?.benchmark===bm ? "3px solid var(--green)" : "3px solid transparent",
                      color: beats ? "var(--green)" : "var(--txt1)"}}>
              {bm}
              <div style={{fontSize:10,color:"var(--txt2)",marginTop:2}}>
                {d.best_val ? `best: ${d.best_val.toFixed(5)}` : "—"}
                {beats && " ✓ SOTA"}
              </div>
            </div>
          );
        })}
      </div>

      {/* Detail */}
      <div style={{flex:1,overflowY:"auto",padding:"18px 22px"}}>
        {!r ? (
          <div style={{color:"var(--txt2)",fontSize:12,marginTop:40,textAlign:"center"}}>
            Select a benchmark to view its reflection.
            {bms.length === 0 && <div style={{marginTop:8}}>Reflections are generated after revision chains complete.</div>}
          </div>
        ) : (
          <>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
              <div style={{fontFamily:"var(--mono)",fontSize:16,fontWeight:700,color:"var(--green)"}}>
                {r.benchmark}
              </div>
              <div style={{fontSize:11,color:"var(--txt2)"}}>
                {r.total_chains} chains · {r.total_keep} keep · best {r.best_val?.toFixed(5) ?? "—"}
              </div>
              <button className="btn" style={{marginLeft:"auto",padding:"3px 10px",fontSize:10}}
                onClick={()=>doRefresh(r.benchmark)} disabled={refreshing}>
                {refreshing ? "Refreshing…" : "↻ Refresh"}
              </button>
              <div style={{fontSize:10,color:"var(--txt2)"}}>{r.generated_at?.slice(0,16)}</div>
            </div>

            {/* Further steps */}
            {r.further_steps?.length > 0 && (
              <div style={{marginBottom:18,background:"var(--bg1)",borderRadius:6,padding:"12px 16px",
                           borderLeft:"3px solid var(--amber)"}}>
                <div className="sec-label" style={{marginBottom:8}}>Recommended Next Steps</div>
                {r.further_steps.map((s,i) => (
                  <div key={i} style={{fontSize:12,color:"var(--txt1)",marginBottom:5,display:"flex",gap:8}}>
                    <span style={{color:"var(--amber)",flexShrink:0}}>{i+1}.</span>
                    <span>{s}</span>
                  </div>
                ))}
              </div>
            )}

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>
              {/* What worked */}
              <div style={{background:"var(--bg1)",borderRadius:6,padding:"12px 16px",
                           borderLeft:"3px solid var(--green)"}}>
                <div className="sec-label" style={{marginBottom:8}}>What Worked</div>
                {(r.what_worked||[]).length === 0
                  ? <div style={{fontSize:11,color:"var(--txt2)"}}>Not enough data yet</div>
                  : (r.what_worked||[]).map((w,i) => (
                    <div key={i} style={{fontSize:11,color:"var(--txt1)",marginBottom:4,
                                         fontFamily:"var(--mono)",lineHeight:1.5}}>{w}</div>
                  ))}
              </div>
              {/* What didn't */}
              <div style={{background:"var(--bg1)",borderRadius:6,padding:"12px 16px",
                           borderLeft:"3px solid var(--red,#e06c75)"}}>
                <div className="sec-label" style={{marginBottom:8}}>What Didn't Work</div>
                {(r.what_didnt||[]).length === 0
                  ? <div style={{fontSize:11,color:"var(--txt2)"}}>Not enough data yet</div>
                  : (r.what_didnt||[]).map((w,i) => (
                    <div key={i} style={{fontSize:11,color:"var(--txt1)",marginBottom:4,
                                         fontFamily:"var(--mono)",lineHeight:1.5}}>{w}</div>
                  ))}
              </div>
            </div>

            {/* Chain summaries */}
            <div className="sec-label" style={{marginBottom:8}}>Revision Chains ({r.chain_summaries?.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {(r.chain_summaries||[]).map((c,i) => (
                <div key={i} style={{background:"var(--bg1)",borderRadius:5,padding:"8px 12px",
                                     borderLeft:`3px solid ${c.final_status==="keep"?"var(--green)":c.improved?"var(--amber)":"var(--border)"}`}}>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <span style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--txt1)",flex:1}}>{c.base}</span>
                    <span style={{fontSize:10,color:"var(--txt2)"}}>{c.revisions} rev</span>
                    <span style={{fontSize:10,color: c.final_status==="keep"?"var(--green)":"var(--txt2)"}}>{c.final_status}</span>
                    {c.best_val && <span style={{fontSize:10,color:"var(--amber)",fontFamily:"var(--mono)"}}>best {c.best_val.toFixed(5)}</span>}
                  </div>
                  <div style={{marginTop:4,display:"flex",gap:6,flexWrap:"wrap"}}>
                    {(c.val_progression||[]).map((v,j) => (
                      <span key={j} style={{fontSize:10,fontFamily:"var(--mono)",
                                             color: v===c.best_val?"var(--green)":"var(--txt2)",
                                             background:"var(--bg0)",padding:"1px 5px",borderRadius:3}}>
                        {v!=null ? (j===0?"r0":"f"+j)+":"+v.toFixed(4) : (j===0?"r0":"f"+j)+":crash"}
                      </span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}


// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [experiments, setExperiments] = useState([]);
  const [queue, setQueue] = useState([]);
  const [active, setActive] = useState([]);
  const [sota, setSota] = useState({});
  const [status, setStatus] = useState({});
  const [lineage, setLineage] = useState({nodes:[],links:[]});
  const [registry, setRegistry] = useState({});
  const [mlflowRuns, setMlflowRuns] = useState([]);
  const [archMap, setArchMap] = useState({});
  const [reflections, setReflections] = useState({});
  const [selected, setSelected] = useState(null);
  const [tab, setTab] = useState("results");
  const [bmFilter, setBmFilter] = useState("all");
  const [error, setError] = useState(null);

  const refresh = useCallback(async () => {
    try {
      const [expR, qR, sotaR, stR, actR, linR, regR, mlfR, archR, reflR] = await Promise.all([
        fetch(`${API}/api/experiments`),
        fetch(`${API}/api/queue`),
        fetch(`${API}/api/sota`),
        fetch(`${API}/api/status`),
        fetch(`${API}/api/active`),
        fetch(`${API}/api/lineage`),
        fetch(`${API}/api/model-registry`),
        fetch(`${API}/api/mlflow/runs`),
        fetch(`${API}/api/arch-map`),
        fetch(`${API}/api/reflections`),
      ]);
      if (!expR.ok) throw new Error(`API ${expR.status}`);
      const [exps, q, s, st, act, lin, reg, mlf, arch, refl] = await Promise.all([
        expR.json(), qR.json(), sotaR.json(), stR.json(), actR.json(),
        linR.json(), regR.json(), mlfR.json(), archR.json(),
        reflR.ok ? reflR.json() : Promise.resolve({}),
      ]);
      setExperiments([...exps].reverse());
      setQueue(q.experiments || []);
      setSota(s);
      setStatus(st);
      setActive(act.active || []);
      setLineage(lin || {nodes:[],links:[]});
      setRegistry(reg || {});
      setMlflowRuns(mlf.runs || []);
      setReflections(refl || {});
      setArchMap(arch || {});
      setError(null);
    } catch (e) {
      setError(e.message);
    }
  }, []);

  useEffect(() => {
    refresh();
    const t = setInterval(refresh, 3000);
    return () => clearInterval(t);
  }, [refresh]);

  // Fetch full detail when selecting
  const handleSelect = async (exp) => {
    setSelected(exp);
    try {
      // completed experiments have exp.id; queue items only have exp.name
      const lookupId = exp.id || exp.name;
      const r = await fetch(`${API}/api/experiment/${lookupId}`);
      if (r.ok) setSelected({...exp, ...(await r.json())});
    } catch {}
  };

  const benchmarks = useMemo(() => {
    const bms = [...new Set(experiments.map(e => e.benchmark))].sort();
    return ["all", ...bms];
  }, [experiments]);

  const paused = status.paused;

  const togglePause = async () => {
    await fetch(`${API}/api/${paused ? "resume" : "pause"}`, {method:"POST"});
    refresh();
  };

  const keepCount = experiments.filter(e=>e.status==="keep").length;
  const pendingCount = queue.length;
  const modelCount = Object.keys(registry).length;

  // Build a set of exp_names that are current champions (for badge rendering)
  const championExpNames = useMemo(() => {
    const names = new Set();
    for (const bm of Object.values(registry)) {
      for (const v of bm.versions || []) {
        if (v.is_champion) names.add(v.exp_name);
      }
    }
    return names;
  }, [registry]);

  return (
    <div className="shell">
      {/* Topbar */}
      <div className="topbar">
        <div className="logo">SCIML · COMMAND CENTER</div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div className={`dot ${paused ? "dot-paused" : "dot-live"}`}/>
          <span style={{fontSize:11,color:"var(--txt2)"}}>{paused ? "PAUSED" : "LIVE"}</span>
        </div>
        <div style={{fontSize:11,color:"var(--txt2)",fontFamily:"var(--mono)"}}>
          {experiments.length} runs · {keepCount} kept · {pendingCount} queued · {modelCount} champions
        </div>
        {error && <div style={{fontSize:11,color:"var(--red)"}}>⚠ {error}</div>}
        <div className="spacer"/>
        <button className={`btn ${paused?"btn-success":"btn-danger"}`} onClick={togglePause}>
          {paused ? "▶ Resume" : "⏸ Pause"}
        </button>
        <button className="btn" onClick={refresh}>↻ Refresh</button>
      </div>

      <div className="body">
        {/* Sidebar: benchmarks + SOTA */}
        <div className="sidebar">
          <div>
            <div className="sec-label">Benchmarks</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <div
                className={`bm-card ${bmFilter==="all"?"active":""}`}
                onClick={()=>setBmFilter("all")}
                style={{padding:"6px 10px"}}
              >
                <div style={{fontSize:12,color:"var(--txt2)"}}>All benchmarks</div>
              </div>
              {Object.entries(sota).map(([bm, data]) => {
                const bm_versions = registry?.[bm]?.versions || [];
                const champ = bm_versions.find(v => v.is_champion && v.exists);
                return (
                  <BmCard key={bm} bm={bm} data={data} active={bmFilter===bm}
                          onClick={()=>setBmFilter(bm)} champion={champ}/>
                );
              })}
            </div>
          </div>

          <hr className="divider"/>

          <div>
            <div className="sec-label">Quick stats</div>
            {status.experiments_count != null && <>
              <div className="metric-row">
                <span className="metric-key">Total runs</span>
                <span className="metric-val" style={{color:"var(--cyan)"}}>{status.experiments_count}</span>
              </div>
              <div className="metric-row">
                <span className="metric-key">VRAM active</span>
                <span className="metric-val" style={{color: status.vram_active_mb > 4096 ? "var(--red)" : status.vram_active_mb > 2048 ? "var(--yellow)" : "var(--green)"}}>{fmt(status.vram_active_mb,0)} MB</span>
              </div>
              <div className="metric-row">
                <span className="metric-key">VRAM peak</span>
                <span className="metric-val" style={{color:"var(--txt2)"}}>{fmt(status.vram_peak_mb,0)} MB</span>
              </div>
              {status.progress != null && <>
                <div className="metric-row">
                  <span className="metric-key">Progress</span>
                  <span className="metric-val" style={{color:"var(--cyan)"}}>{(status.progress*100).toFixed(1)}%</span>
                </div>
                <div style={{height:4,background:"var(--border)",borderRadius:2,margin:"2px 0 4px"}}>
                  <div style={{height:"100%",borderRadius:2,width:`${(status.progress*100).toFixed(1)}%`,
                               background:`hsl(${Math.round(status.progress*120)},70%,50%)`,transition:"width 1s linear"}}/>
                </div>
                {status.remaining_s != null && <div className="metric-row">
                  <span className="metric-key">Time left</span>
                  <span className="metric-val" style={{color: status.remaining_s < 30 ? "var(--red)" : "var(--amber)"}}>
                    {status.remaining_s >= 60
                      ? `${Math.floor(status.remaining_s/60)}m ${Math.round(status.remaining_s%60)}s`
                      : `${Math.round(status.remaining_s)}s`}
                  </span>
                </div>}
                {status.step != null && <div className="metric-row">
                  <span className="metric-key">Step</span>
                  <span className="metric-val" style={{color:"var(--txt2)"}}>{status.step}</span>
                </div>}
                {status.loss != null && <div className="metric-row">
                  <span className="metric-key">Loss</span>
                  <span className="metric-val" style={{color:"var(--amber)"}}>{status.loss.toExponential(4)}</span>
                </div>}
              </>}
              <div className="metric-row">
                <span className="metric-key">Last update</span>
                <span style={{fontSize:11,color:"var(--txt2)"}}>{fmtDur(status.last_updated)}</span>
              </div>
            </>}
          <ModelCompareChart experiments={experiments} benchmark={bmFilter} sota={sota}/>
          </div>
        </div>

        {/* Main area */}
        <div className="main">
          <div className="tabs">
            <div className={`tab ${tab==="results"?"active":""}`} onClick={()=>setTab("results")}>
              Results ({experiments.filter(e=>bmFilter==="all"||e.benchmark===bmFilter).length})
            </div>
            <div className={`tab ${tab==="queue"?"active":""}`} onClick={()=>setTab("queue")}>
              Queue ({pendingCount})
            </div>
            <div className={`tab ${tab==="models"?"active":""}`} onClick={()=>setTab("models")}
              style={{color: tab==="models" ? "var(--amber)" : undefined,
                      borderBottomColor: tab==="models" ? "var(--amber)" : undefined}}>
              Models ({Object.keys(archMap).length})
            </div>
            <div className={`tab ${tab==="benchmarks"?"active":""}`} onClick={()=>setTab("benchmarks")}
              style={{color: tab==="benchmarks" ? "var(--cyan)" : undefined,
                      borderBottomColor: tab==="benchmarks" ? "var(--cyan)" : undefined}}>
              Benchmarks ({Object.keys(sota).length})
            </div>
            <div className={`tab ${tab==="lineage"?"active":""}`} onClick={()=>setTab("lineage")}>
              Lineage DAG
            </div>
            <div className={`tab ${tab==="reflection"?"active":""}`} onClick={()=>setTab("reflection")}
              style={{color: tab==="reflection" ? "var(--green)" : undefined,
                      borderBottomColor: tab==="reflection" ? "var(--green)" : undefined}}>
              Reflection ({Object.keys(reflections).length})
            </div>
          </div>

          {/* Active experiment strip — one row per running experiment */}
          {active.filter(n => n !== "dashboard_server").map(name => {
            const qExp = queue.find(e => e.name === name);
            // Look up per-experiment telemetry from active_runs; fall back to global status
            // for backwards-compat with old trainers that don't write named files.
            const runData = (status.active_runs || []).find(r => r.experiment === name) || {};
            const hasOwn  = Object.keys(runData).length > 0;
            const prog    = hasOwn ? runData.progress    : status.progress;
            const remS    = hasOwn ? runData.remaining_s : status.remaining_s;
            const step    = hasOwn ? runData.step        : status.step;
            const loss    = hasOwn ? runData.loss        : status.loss;
            const hist    = hasOwn ? runData.loss_history: status.loss_history;
            const pct     = prog != null ? (prog * 100).toFixed(1) : null;
            const remStr  = remS != null
              ? remS >= 60 ? `${Math.floor(remS/60)}m ${Math.round(remS%60)}s` : `${Math.round(remS)}s`
              : null;
            return (
              <div key={name}
                style={{background:"var(--bg1)",borderBottom:"1px solid var(--border)",
                        display:"flex",flexDirection:"column",gap:0,cursor:"pointer",flexShrink:0}}
                onClick={() => setSelected({id: name, status:"running", name, ...(qExp||{})})}>
                {/* Top row */}
                <div style={{padding:"6px 12px",display:"flex",alignItems:"center",gap:10}}>
                  <div className="dot dot-live" style={{flexShrink:0}}/>
                  <span style={{fontSize:11,color:"var(--green)",fontFamily:"var(--mono)",fontWeight:600}}>RUNNING</span>
                  <span style={{fontSize:11,fontFamily:"var(--mono)",color:"var(--cyan)"}}>{name}</span>
                  {qExp && <span style={{fontSize:11,color:"var(--txt2)"}}>· {qExp.benchmark} · {qExp.model} h={qExp.hidden_dim} l={qExp.n_layers} m={qExp.n_modes}</span>}
                  <span style={{display:"flex",alignItems:"center",gap:14,marginLeft:"auto"}}>
                    {step != null && <span style={{fontSize:11,fontFamily:"var(--mono)",color:"var(--txt2)"}}>step {step}</span>}
                    {loss != null && <span style={{display:"flex",alignItems:"center",gap:4}}>
                      <SparkLine points={hist}/>
                      <span style={{fontSize:11,fontFamily:"var(--mono)",color:"var(--amber)"}}>loss {loss.toExponential(4)}</span>
                    </span>}
                    {pct != null && <span style={{fontSize:11,fontFamily:"var(--mono)",color:"var(--cyan)"}}>{pct}%</span>}
                    {remStr != null && <span style={{fontSize:11,fontFamily:"var(--mono)",color:parseFloat(remStr) < 30 ? "var(--red)" : "var(--txt2)"}}>⏱ {remStr}</span>}
                    <button
                      className="btn btn-danger"
                      style={{padding:"1px 7px",fontSize:10,marginLeft:4}}
                      onClick={async (ev) => {
                        ev.stopPropagation();
                        if (confirm(`Kill experiment "${name}"?`)) {
                          await fetch(`${API}/api/kill/${name}`, {method:"POST"});
                          refresh();
                        }
                      }}>✕ Kill</button>
                  </span>
                </div>
                {/* Progress bar */}
                {prog != null && (
                  <div style={{height:3,background:"var(--border)",width:"100%"}}>
                    <div style={{height:"100%",width:`${(prog*100).toFixed(1)}%`,
                                 background:`hsl(${Math.round(prog*120)},70%,50%)`,
                                 transition:"width 1s linear"}}/>
                  </div>
                )}
              </div>
            );
          })}

          <div className="tab-body">
            {tab==="results" && (
              <ExpTable
                experiments={experiments}
                sota={sota}
                selectedId={selected?.id}
                onSelect={handleSelect}
                bmFilter={bmFilter}
                championExpNames={championExpNames}
              />
            )}
            {tab==="queue" && <QueueTable queue={queue} active={active} onSelect={(e) => setSelected({id: e.name, status: "running", ...e})}/>}
            {tab==="models" && (
              <ModelsTab
                registry={registry}
                mlflowRuns={mlflowRuns}
                sota={sota}
                archMap={archMap}
                experiments={experiments}
              />
            )}
            {tab==="benchmarks" && (
              <BenchmarksTab
                sota={sota}
                registry={registry}
                experiments={experiments}
                archMap={archMap}
              />
            )}
            {tab==="lineage" && <LineageDAG lineage={lineage} onSelect={handleSelect}/>}
            {tab==="reflection" && (
              <ReflectionPanel reflections={reflections} sota={sota} bmFilter={bmFilter}/>
            )}
          </div>
        </div>

        {/* Inspector — hidden on Models and Benchmarks tabs (they have their own detail panels) */}
        {tab !== "models" && tab !== "benchmarks" && (
          <Inspector exp={selected} sota={sota} archMap={archMap} onClose={()=>setSelected(null)}/>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
