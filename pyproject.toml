[project]
name = "autoresearch-sciml-mlx"
version = "0.1.0"
description = "Apple Silicon MLX port of Karpathy's autoresearch - Repurposed for SciML (PDE Solvers, PINNs, Neural Operators)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mlx>=0.30.0",
    "numpy>=2.2.6",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.43.0",
    "torch>=2.11.0",
    "mlflow>=2.14.0",
    "dvc>=3.50.0",
]
