[project]
name = "autoresearch-sciml-pytorch"
version = "0.2.0"
description = "PyTorch port of autoresearch for Linux/GPU execution - SciML (PDE Solvers, PINNs, Neural Operators)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.43.0",
    "torch>=2.11.0",
    "mlflow>=2.14.0",
    "dvc>=3.50.0",
]
