[project]
name = "autoresearch-sciml-mlx"
version = "0.1.0"
description = "Apple Silicon MLX port of Karpathy's autoresearch - Repurposed for SciML (PDE Solvers, PINNs, Neural Operators)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "mlflow>=2.13.0",
    "dvc>=3.50.0",
    "einops>=0.8.0",
    "optuna>=3.6.0",
    "duckdb>=1.0.0",
    "zarr>=2.18.0",
    "filelock>=3.13.0",
    "google-generativeai>=0.8.0",
    "pint>=0.24",
    "z3-solver>=4.13",
    "wavio>=0.0.8",
]

[project.optional-dependencies]
torch = ["torch>=2.4.0"]
mlx = ["mlx>=0.30.0"]
backends = ["torch>=2.4.0", "mlx>=0.30.0"]
all = ["torch>=2.4.0", "mlx>=0.30.0"]

