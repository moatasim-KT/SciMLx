title: "Alias-Free Mamba Neural Operator"
short_id: mambano_2024
authors: "Zheng et al."
year: 2024
venue: "NeurIPS"
key_idea: |
  Combines global integration via Mamba (selective SSM) with local convolution. 
  Proposes an alias-free design for neural operators to maintain spectral accuracy 
  and prevent aliasing when using SSMs for PDE solving. Maintains O(N) complexity.
benchmarks:
