    benchmark: "burgers_1d"
    model: "TFNO"
    hidden_dim: 64
    n_layers: 4
    n_modes: 16
    rationale: "Test TFNO on standard benchmarks first before MHD solver addition"

status: reference
verdict: "Rich model zoo — TFNO and Transolver are highest-priority additions; others (MeshGraphNet, DoMINO) require mesh infrastructure beyond our current scope."
