    rationale: "Wider UDE — more expressive correction network for Burgers"

  - name: "latent_ode_wave_h64_l4_s20"
    benchmark: "wave_1d"
    model: "LatentODE"
    hidden_dim: 64
    n_layers: 4
    n_modes: 16
    n_steps: 20
    rationale: "LatentODE: efficient latent integration for wave_1d"

  - name: "latent_ode_burgers_h64_l4_s20"
    benchmark: "burgers_1d"
    model: "LatentODE"
    hidden_dim: 64
    n_layers: 4
    n_modes: 16
    n_steps: 20
    rationale: "LatentODE on Burgers — latent space absorbs multi-scale structure"

