title: "On the Benefits of Memory for Modeling Time-Dependent PDEs"
short_id: memno_2025
authors: "Buitrago Ruiz et al."
year: 2025
venue: "ICLR"
key_idea: |
  Introduces Memory Neural Operator (MemNO), integrating structured state space 
  models (S4) into FNO to handle time-dependent PDEs. Especially robust to 
  low-resolution and noisy observation data by effectively capturing temporal memory.
