title: "PINNacle: A Comprehensive Benchmark of Physics-Informed Neural Networks for Solving PDEs"
short_id: pinnacle_2024
authors: "Zhiwei Hao, Jiachen Yao, Chang Su, Hang Su, Zhaofeng He, Songming Liu, Yichi Zhang, Chengyang Ying, Yao Feng, Jun Zhu"
year: 2024
venue: "NeurIPS 2024 (Datasets & Benchmarks Track)"
arxiv: "https://arxiv.org/abs/2306.08827"
source: "MLiS (Machine Learning in Science) conference series; cited as key benchmark"

key_idea: |
  Comprehensive benchmark evaluating ~10 PINN variants on 20+ distinct PDEs spanning
  1D-3D, including Burgers, Allen-Cahn, Navier-Stokes, Helmholtz, Poisson, and others.
  Key variants compared: vanilla PINN, PINN-NTK (NTK-based adaptive weights),
  gPINN (gradient-enhanced), vPINN (variational), FBPINN (finite-basis domain decomp),
  SA-PINN (self-adaptive), causal PINN, and RAR-D (residual adaptive resampling).

reported_results:
  burgers_1d:
    vanilla_pinn:   0.0132
    pinn_ntk:       0.0130   # best on Burgers
    fbpinn:         0.0132
  allen_cahn_1d:
    vanilla_pinn:   0.498    # all variants fail; multi-scale challenge
    best:           0.498
  navier_stokes_2d:
    vanilla_pinn:   0.0942
    pinn_ntk:       0.1540
    gpinn:          0.1930
    vpinn:          0.0935
    fbpinn:         0.0245   # best on NS — domain decomp wins
  helmholtz_2d:
    fbpinn:         0.0050   # domain decomp excels on high-frequency problems

key_findings:
  - "Vanilla PINN competitive on smooth 1D problems (Burgers ~1.3% error)"
  - "Allen-Cahn is pathological: all PINN variants ~50% error — multi-scale failure mode"
  - "FBPINN (Finite Basis PINNs) is the best PINN for NS and multi-scale problems"
  - "NTK-weighting helps marginally on well-conditioned problems"
  - "None of the PINN variants approach FNO-level accuracy on data-rich regimes"

suggested_experiments:
  - name: "fbpinn_burgers_h64_k8_overlap02"
    benchmark: "burgers_1d"
    model: "FBPINN"
    n_subdomains: 8
    overlap: 0.2
    rationale: "FBPINN domain decomp on Burgers — can finite-basis beat vanilla PINN?"

  - name: "fbpinn_ns2d_k16_overlap03"
    benchmark: "ns_2d"
    model: "FBPINN"
    n_subdomains: 16
    overlap: 0.3
    rationale: "FBPINN showed 4× better NS than vanilla PINN (0.0245 vs 0.0942)"

  - name: "pinn_ntk_burgers_h128_l4"
    benchmark: "burgers_1d"
    model: "PINN"
    ntk_weighting: true
    hidden_dim: 128
    n_layers: 4
    rationale: "NTK-weighted PINN — matches PINNacle PINN-NTK baseline"

